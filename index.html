<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4ed"><title>Small Steps</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232f5e50'/%3E%3Cpath d='M17 42c6-2 7-9 13-10 7-1 7-11 17-12M37 17l10 3-3 10' fill='none' stroke='%23e8efc4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#253e35;background:#f5f4ed;font-synthesis:none}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;display:flex;flex-direction:column;height:100dvh}.shell{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;scroll-padding:20px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #cc9a4d;outline-offset:3px}.shell{max-width:780px;margin:auto;padding:24px 20px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:-.03em}.logo{width:39px;height:39px;border-radius:13px;background:#315f51;display:grid;place-items:center;color:#e7efc4}.tag{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#6b8174}.hero{position:relative;overflow:hidden;background:#315f51;color:#f7f7e9;padding:27px;border-radius:25px;margin-bottom:25px}.hero:after{content:'✳';position:absolute;font-size:150px;color:#cbe3a7;opacity:.1;right:-7px;top:-33px}.hero .tag{color:#c9dbb6}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,8vw,45px);line-height:1.06;letter-spacing:-.04em;margin:16px 0 10px;max-width:420px}.hero p{line-height:1.55;color:#d9e7d4;max-width:420px;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 0 13px;gap:10px}.section-head h2,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.03em;font-size:27px;margin:0}.muted{color:#718478;font-size:13px;line-height:1.5}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid #e8ebe1;border-radius:18px;padding:17px;box-shadow:0 4px 20px #283e2e08}.track{width:100%;text-align:left;display:flex;gap:14px;align-items:center;color:inherit}.track:hover,.secondary:hover{border-color:#9aafa1}.track-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;font-size:21px;flex:none}.track b{display:block;font-size:16px;letter-spacing:-.02em}.track small{display:block;color:#718478;margin-top:4px;font-size:13px}.arrow{margin-left:auto;font-size:20px;color:#8a9c8c}.sand{background:#f5e5c8}.mint{background:#dfecdc}.lavender{background:#ece5f0}.note{padding:16px 18px;background:#e9efe4;border-radius:16px;font-size:14px;line-height:1.5;margin-top:20px}.nav{position:relative;flex:0 0 auto;background:#fafbf5ed;backdrop-filter:blur(14px);border-top:1px solid #e1e8de;display:flex;justify-content:center;padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#75877a;min-width:58px;padding:6px 8px;font-size:11px;font-weight:700}.nav button span{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}.nav button.active{color:#2d6753}.back{background:none;border:0;color:#557466;padding:0;margin-bottom:22px;font-weight:700}.intro{font-size:15px;line-height:1.55;color:#607568;margin:10px 0 22px}.pill{display:inline-block;border-radius:50px;padding:5px 9px;background:#eef3e8;font-size:11px;font-weight:800;letter-spacing:.04em;color:#55745e}.step{display:flex;gap:12px;align-items:start;margin-bottom:10px}.num{width:30px;height:30px;border-radius:50%;background:#e7efe1;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}.step h3{font-size:15px;margin:3px 0 9px;line-height:1.4}.row{display:flex;flex-wrap:wrap;gap:8px}.btn,.secondary{border:0;border-radius:11px;padding:10px 13px;font-weight:750;font-size:13px}.btn{background:#315f51;color:white}.secondary{background:#f5f7f1;color:#49685a;border:1px solid #e4ebe0}.linkbtn{background:none;border:0;padding:6px 0;color:#527463;font-weight:700;font-size:13px}.form label{display:block;font-size:13px;font-weight:750;margin:16px 0 6px}.form input,.form textarea,.form select{display:block;width:100%;border:1px solid #dce5d9;border-radius:11px;padding:12px;background:#fff;color:#253e35}.form textarea{min-height:85px;resize:vertical}.form .btn{margin-top:18px}.entry{margin-bottom:10px}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.breath{background:#e8efe2;border-radius:23px;padding:28px;text-align:center;margin:20px 0}.orb{height:120px;width:120px;margin:12px auto;border-radius:50%;background:#c7dfbd;display:grid;place-items:center;color:#315f51;font-family:Georgia,serif;font-size:18px}.hidden{display:none}.danger{color:#9a4c40}.footer{font-size:12px;color:#738779;line-height:1.55;margin-top:28px}a{color:#346b58}@media(min-width:650px){.cards.tracks{grid-template-columns:repeat(3,1fr)}.track{align-items:start;flex-direction:column;min-height:154px}.track .arrow{align-self:end}.shell{padding-top:35px}.hero{padding:38px}}
</style></head><body><main class="shell" id="app"></main><nav class="nav" aria-label="Main navigation"><button data-nav="home"><span>⌂</span>Home</button><button data-nav="lessons"><span>▷</span>Lessons</button><button data-nav="progress"><span>◒</span>My notes</button><button data-nav="calm"><span>✳</span>Pause</button><button data-nav="settings"><span>⚙</span>Settings</button></nav><script>
'use strict';const KEY='smallsteps-v1';const defaults=[{id:'talk',name:'Starting conversations',sub:'Open with something simple',icon:'✦',color:'sand',steps:['Say hello to someone you see regularly','Ask a simple question, like how someone’s day is going','Share a small observation and invite a response']},{id:'groups',name:'Being in groups',sub:'Find your place at your pace',icon:'◌',color:'mint',steps:['Spend a few minutes near a small group','Listen to a group conversation and stay as long as you choose','Add a short comment to a small group conversation']},{id:'voice',name:'Speaking up',sub:'Give your voice a little room',icon:'↗',color:'lavender',steps:['State a small preference to someone you trust','Ask a question when you want clarification','Share a brief opinion in a conversation']}];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{tracks:JSON.parse(JSON.stringify(defaults)),entries:[]};if(!Array.isArray(state.tracks)||!Array.isArray(state.entries))throw 0}catch(e){state={tracks:JSON.parse(JSON.stringify(defaults)),entries:[]}}const lessons=[{"title": "A small opening", "track": "Starting conversations", "audio": "lesson1.mp3", "duration": "1:53", "text": "Starting a conversation can feel like standing at the edge of a cold swimming pool. Your mind may tell you that you need the perfect opening, or that one awkward moment will ruin everything. But a conversation doesn't need a perfect beginning. It needs a small opening and room for another person to respond.\n\nLet's make the task smaller. Rather than trying to be interesting for ten minutes, consider saying hello to someone you already see. That's it. You might say, \"Good morning,\" to a neighbor or someone at a familiar place. You don't have to turn it into a conversation. If even that feels too big today, simply choose a person you might greet another time. Or rehearse the words quietly on your own. You choose the size of the step.\n\nBefore you try, notice any prediction. Maybe the thought is, \"They'll think I'm strange,\" or \"I won't know what to say.\" You don't need to argue with that thought. Just recognize that it is a prediction, not a report of what has happened. If you like, use the reflection in the app to write it down.\n\nAfterward, consider what actually happened. Perhaps the other person smiled. Perhaps they were distracted. Perhaps you felt nervous and still said hello. All of those are observations. A brief or neutral response isn't proof that you did something wrong; you usually can't know what else is on someone's mind.\n\nIf the greeting feels manageable another day, you can add one simple question: \"How's your day going?\" Listen to the answer, and let that be enough. You can leave the conversation naturally with \"Good seeing you.\" You do not owe anyone a long performance.\n\nThe goal is not to eliminate every uncomfortable feeling. The goal is to give yourself a choice and learn from a small experiment. If the step feels overwhelming, stop, pause, or make it smaller. There's no penalty for coming back to it later. Your effort deserves kindness, whether the interaction felt easy or awkward."}, {"title": "Finding your place in a group", "track": "Being in groups", "audio": "lesson2.mp3", "duration": "2:06", "text": "Groups can be difficult because several conversations and reactions are happening at once. You may wonder when to speak, whether you belong, or whether everyone is judging you. Those worries can pull your attention inward, making it even harder to notice what's happening around you. You don't need to become the loudest person in the room to belong in a group.\n\nStart by choosing a situation that feels relatively manageable. That might be a small gathering with someone you know, rather than a crowded event. Decide how long you want to stay, with permission to leave earlier. The point isn't to endure as much discomfort as possible; it's to practice a step you have chosen.\n\nYour first exercise can be spending a few minutes near a small group. You could listen to the topic, notice who is speaking, and allow yourself to be present without preparing a perfect contribution. If that feels too much, an easier alternative is to imagine the setting, or stand nearby for a shorter time. You can stop or change the plan whenever you need to.\n\nWhen you're ready for a next step, try a short contribution connected to what's already being discussed. It might be, \"That sounds interesting,\" or \"How did that go?\" You can even ask someone to repeat a point you missed. A contribution doesn't need to be clever or long. Conversations are shared, and listening is part of participating too.\n\nBefore you practice, you might notice a prediction such as, \"Everyone will notice I'm nervous.\" Afterward, gently compare it with what you observed. Maybe one person answered your question. Maybe you didn't know what everyone was thinking. Maybe your voice felt shaky. Stick to what you actually know, rather than filling in every blank with the harshest explanation.\n\nIf the group is unkind or the situation feels unsafe, you don't have to stay. Choosing a different setting or a trusted person is a sensible adjustment. You can repeat the same manageable step as often as you want, and skip or edit the exercises in this app. Progress is not a straight line. What matters is that you are practicing in a way that respects your own limits."}, {"title": "Giving your voice room", "track": "Speaking up", "audio": "lesson3.mp3", "duration": "2:04", "text": "Speaking up doesn't have to mean giving a speech. Often it starts with a small preference: \"I'd rather sit over there,\" or \"Could you explain that again?\" If you're shy, even a short sentence can feel important. That doesn't mean you're doing it wrong. It means you can start with a step small enough to be workable.\n\nFor this exercise, choose someone you generally feel comfortable with. Think of an ordinary, low-stakes preference that is true for you. Perhaps you prefer tea to coffee, or would like to choose a different time for a call. You might say, \"I'd prefer tea, thanks.\" You don't need to justify your preference or deliver the sentence perfectly.\n\nIf saying it to another person feels too hard right now, an easier version is to write the sentence down or practice saying it privately. Once that feels manageable, you might share it with the person you've chosen. You are free to wait, skip it, change it, or try another setting. Avoid situations where speaking up would put you at risk.\n\nNotice what your mind predicts. It might say, \"They'll be annoyed,\" or \"I'll sound foolish.\" These are understandable thoughts, but they are not evidence of the other person's reaction. If you want, write down the prediction before the exercise, then note what happened afterward. Did the person respond? What did they actually say? What remains unknown? Did you do anything you want to acknowledge, even if it felt awkward?\n\nPeople may not always agree with your preference. A different answer doesn't automatically mean speaking up was a mistake. The practice is expressing a reasonable preference, not controlling the response. You can be brief, respectful, and still leave space for the other person's needs.\n\nA next step might be asking a question when you want clarification. You can use a simple phrase like, \"Could you go over that once more?\" Or you may repeat the first exercise. There's no timetable and no streak to protect. You get to decide what feels manageable. And if anxiety is interfering with daily life, support from a healthcare professional is another option alongside self-guided practice."}];let page='home',current='',stepIndex=0,timer=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Could not save in this browser. Your latest change may not persist.');return false}}function show(p){if(timer){clearInterval(timer);timer=null}page=p;render();app.scrollTo(0,0)}function track(){return state.tracks.find(t=>t.id===current)}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));let h='<div class="top"><div class="brand"><div class="logo">↗</div>small steps</div><span class="tag">at your pace</span></div>';if(page==='home'){h+=`<section class="hero"><div class="tag">A little practice, a lot of kindness</div><h1>Confidence grows one small step at a time.</h1><p>Choose what feels manageable today. There’s no rush, and you’re always in charge.</p></section><div class="section-head"><h2>Choose a path</h2><span class="muted">Start anywhere</span></div><div class="cards tracks">${state.tracks.map(t=>`<button class="card track" data-track="${esc(t.id)}"><span class="track-icon ${esc(t.color)}">${esc(t.icon)}</span><span><b>${esc(t.name)}</b><small>${esc(t.sub)}</small></span><span class="arrow">↗</span></button>`).join('')}</div><div class="note">🌱 &nbsp; Showing up for yourself counts. It’s okay to pause, skip a step, or make it smaller.</div>`}else if(page==='track'){let t=track();if(!t){show('home');return}let next=t.steps.findIndex(s=>!state.entries.some(e=>e.track===t.name&&e.step===s));if(next<0)next=Math.max(0,t.steps.length-1);h+=`<button class="back" data-go="home">← All paths</button><div class="tag">Your practice path</div><h2>${esc(t.name)}</h2><p class="intro">Pick any step, change the wording, or add your own. Choose something that feels manageable—not overwhelming.</p>${t.steps.map((s,i)=>`<div class="card step"><span class="num">${i+1}</span><div style="flex:1;min-width:0">${i===next?'<span class="pill">Suggested next step</span>':''}<h3>${esc(s)}</h3><p class="muted">Easier option: ${esc(i===0?({talk:"Imagine or rehearse a hello privately.",groups:"Picture the setting or stay nearby for a shorter time.",voice:"Write your preference down or say it privately."}[t.id]||"Make this step smaller."):"Try a smaller part of this step, or return to an earlier one.")}</p><div class="row"><button class="btn" data-practice="${i}">Try this</button><button class="secondary" data-edit="${i}">Edit</button><button class="secondary" data-delete="${i}" aria-label="Delete step ${i+1}">Remove</button></div></div></div>`).join('')}<button class="secondary" data-add>Add a step ＋</button><div class="note">You can stop or change course at any time. There’s no need to push through distress.</div>`}else if(page==='practice'){let t=track(),s=t?.steps[stepIndex];if(!s){show('home');return}h+=`<button class="back" data-go="track">← Back to path</button><div class="tag">A step you chose</div><h2>${esc(s)}</h2><p class="intro">Try it when you feel ready. You can save a note now, later, or not at all.</p><form class="card form" id="reflection"><label for="prediction">What do you predict might happen? <span class="muted">Optional</span></label><textarea id="prediction" placeholder="A thought, not a fact…"></textarea><label for="before">How difficult does it feel? <span class="muted">Optional</span></label><select id="before"><option value="">Prefer not to rate</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><div class="muted">1 = easier · 5 = harder</div><label for="outcome">What actually happened? <span class="muted">Optional</span></label><textarea id="outcome" placeholder="Notice what happened, without judging yourself"></textarea><label for="after">How difficult did it feel afterward? <span class="muted">Optional</span></label><select id="after"><option value="">Prefer not to rate</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label for="kind">What would you like to remember? <span class="muted">Optional</span></label><textarea id="kind" placeholder="Even a small effort is worth noticing"></textarea><button class="btn" type="submit">Save this reflection</button></form><p class="muted">Not ready? Go back, make the step smaller, or skip it. Nothing is lost.</p>`}else if(page==='lessons'){h+=`<div class="tag">Listen & learn</div><h2>Short lessons</h2><p class="intro">Three original audio lessons, each paired with a practice path. Listen here or read the transcript. The voice is computer-generated.</p>${lessons.map((l,i)=>`<article class="card entry"><span class="pill">${esc(l.track)}</span> <span class="muted">${esc(l.duration)}</span><h3>${esc(l.title)}</h3><audio controls preload="none" style="width:100%" src="${esc(l.audio)}">Your browser does not support audio playback.</audio><details><summary class="linkbtn">Read transcript</summary><p>${esc(l.text)}</p></details><button class="secondary" data-lesson-track="${i}">Go to exercise →</button></article>`).join('')}` }else if(page==='progress'){h+=`<div class="tag">Your space</div><h2>Notes on your journey</h2><p class="intro">A place to notice effort and what you learned—not a scorecard.</p>${state.entries.length?state.entries.slice().reverse().map(e=>`<article class="card entry"><span class="pill">${esc(e.track)}</span> <span class="muted">${esc(e.date)}</span><h3>${esc(e.step)}</h3>${e.prediction?`<p><b>Predicted:</b> ${esc(e.prediction)}</p>`:''}${e.outcome?`<p><b>What happened:</b> ${esc(e.outcome)}</p>`:''}${e.kind?`<p><b>Remember:</b> ${esc(e.kind)}</p>`:''}${e.before||e.after?`<p class="muted">Difficulty: ${esc(e.before||'—')} before · ${esc(e.after||'—')} after (out of 5)</p>`:''}<button class="linkbtn danger" data-remove-entry="${esc(e.id)}">Delete note</button></article>`).join(''):'<div class="card"><p>No notes yet. When you choose to save a reflection, it will appear here.</p></div>'}`}else if(page==='calm'){h+=`<div class="tag">A moment for you</div><h2>Take a gentle pause.</h2><p class="intro">If it feels comfortable, try a few easy breaths. No need to change or control anything. You can stop whenever you like.</p><div class="breath"><div class="orb" id="breath-text">Just breathe</div><p class="muted">Breathe in gently, then let the breath go naturally.</p><button class="btn" id="breath">Start gentle guide</button></div><div class="note">Or simply look around and notice a few things you can see. This is optional, never a requirement before a step.</div>`}else if(page==='settings'){h+=`<div class="tag">Your data, your choice</div><h2>Settings & privacy</h2><p class="intro">Your notes and edited steps are stored in this browser on this device. They are not encrypted or synced. Anyone with access to this browser may see them, and clearing browser data can delete them.</p><div class="card"><h3>Keep a backup</h3><p class="muted">Export a JSON file and keep it somewhere private. The file contains your notes in readable form. Import replaces the current app data.</p><div class="row"><button class="btn" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input type="file" id="file" accept="application/json,.json" hidden></div></div><div class="card" style="margin-top:10px"><h3>Start fresh</h3><p class="muted">This removes all notes and custom steps from this browser and restores the original paths.</p><button class="secondary danger" id="reset">Reset app data</button></div><p class="footer">This app is a self-guided practice tool, not a diagnosis or a replacement for care. If anxiety is affecting daily life, consider talking with a healthcare professional. Ideas informed by <a href="https://www.nhs.uk/mental-health/conditions/social-anxiety/">NHS</a> and <a href="https://www.nimh.nih.gov/health/publications/social-anxiety-disorder-more-than-just-shyness">NIMH</a>. No analytics or remote journal collection.</p>`}app.innerHTML=h;bind()}function bind(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));app.querySelectorAll('[data-lesson-track]').forEach(b=>b.onclick=()=>{current=state.tracks[+b.dataset.lessonTrack].id;show('track')});app.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{current=b.dataset.track;show('track')});app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{stepIndex=+b.dataset.practice;show('practice')});app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let i=+b.dataset.edit,v=prompt('Make this step your own:',track().steps[i]);if(v!==null&&v.trim()){track().steps[i]=v.trim();save();render()}});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Remove this step?')){track().steps.splice(+b.dataset.delete,1);save();render()}});let add=app.querySelector('[data-add]');if(add)add.onclick=()=>{let v=prompt('What manageable step would you like to add?');if(v&&v.trim()){track().steps.push(v.trim());save();render()}};let f=document.getElementById('reflection');if(f)f.onsubmit=e=>{e.preventDefault();let val=id=>document.getElementById(id).value.trim();state.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:new Date().toLocaleDateString(),track:track().name,step:track().steps[stepIndex],prediction:val('prediction'),outcome:val('outcome'),kind:val('kind'),before:val('before'),after:val('after')});if(save())show('progress')};app.querySelectorAll('[data-remove-entry]').forEach(b=>b.onclick=()=>{if(confirm('Delete this note?')){state.entries=state.entries.filter(e=>e.id!==b.dataset.removeEntry);save();render()}});let breath=document.getElementById('breath');if(breath)breath.onclick=()=>{if(timer){clearInterval(timer);timer=null;breath.textContent='Start gentle guide';document.getElementById('breath-text').textContent='Just breathe'}else{let n=0;document.getElementById('breath-text').textContent='Breathe in';breath.textContent='Stop guide';timer=setInterval(()=>{n++;document.getElementById('breath-text').textContent=n%2?'Breathe out':'Breathe in'},4000)}};let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'smallsteps',version:1,data:state},null,2)],{type:'application/json'}));a.download='small-steps-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};let imp=document.getElementById('import'),file=document.getElementById('file');if(imp)imp.onclick=()=>file.click();if(file)file.onchange=async()=>{try{let x=JSON.parse(await file.files[0].text());if(x.format!=='smallsteps'||x.version!==1||!x.data||!Array.isArray(x.data.tracks)||!Array.isArray(x.data.entries)||x.data.tracks.length!==3||!x.data.tracks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&typeof t.sub==='string'&&typeof t.icon==='string'&&typeof t.color==='string'&&Array.isArray(t.steps)&&t.steps.every(s=>typeof s==='string'))||!x.data.entries.every(e=>e&&typeof e.id==='string'&&typeof e.step==='string'))throw Error();if(confirm('Replace current notes and paths with this backup?')){state=x.data;if(save()){alert('Backup imported.');show('home')}}}catch(e){alert('This is not a valid Small Steps backup. Nothing was changed.')}file.value=''};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Delete all notes and custom steps on this browser? This cannot be undone.')){state={tracks:JSON.parse(JSON.stringify(defaults)),entries:[]};save();show('home')}}}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
