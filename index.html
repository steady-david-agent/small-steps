:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#253e35;background:#f5f4ed;font-synthesis:none}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;display:flex;flex-direction:column;height:100dvh}.shell{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;scroll-padding:20px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #cc9a4d;outline-offset:3px}.shell{max-width:780px;margin:auto;padding:24px 20px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:-.03em}.logo{width:39px;height:39px;border-radius:13px;background:#315f51;display:grid;place-items:center;color:#e7efc4}.tag{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#6b8174}.hero{position:relative;overflow:hidden;background:#315f51;color:#f7f7e9;padding:27px;border-radius:25px;margin-bottom:25px}.hero:after{content:'✳';position:absolute;font-size:150px;color:#cbe3a7;opacity:.1;right:-7px;top:-33px}.hero .tag{color:#c9dbb6}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,8vw,45px);line-height:1.06;letter-spacing:-.04em;margin:16px 0 10px;max-width:420px}.hero p{line-height:1.55;color:#d9e7d4;max-width:420px;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 0 13px;gap:10px}.section-head h2,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.03em;font-size:27px;margin:0}.muted{color:#718478;font-size:13px;line-height:1.5}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid #e8ebe1;border-radius:18px;padding:17px;box-shadow:0 4px 20px #283e2e08}.track{width:100%;text-align:left;display:flex;gap:14px;align-items:center;color:inherit}.track:hover,.secondary:hover{border-color:#9aafa1}.track-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;font-size:21px;flex:none}.track b{display:block;font-size:16px;letter-spacing:-.02em}.track small{display:block;color:#718478;margin-top:4px;font-size:13px}.arrow{margin-left:auto;font-size:20px;color:#8a9c8c}.sand{background:#f5e5c8}.mint{background:#dfecdc}.lavender{background:#ece5f0}.note{padding:16px 18px;background:#e9efe4;border-radius:16px;font-size:14px;line-height:1.5;margin-top:20px}.nav{position:relative;flex:0 0 auto;background:#fafbf5ed;backdrop-filter:blur(14px);border-top:1px solid #e1e8de;display:flex;justify-content:center;padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#75877a;min-width:58px;padding:6px 8px;font-size:11px;font-weight:700}.nav button span{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}.nav button.active{color:#2d6753}.back{background:none;border:0;color:#557466;padding:0;margin-bottom:22px;font-weight:700}.intro{font-size:15px;line-height:1.55;color:#607568;margin:10px 0 22px}.pill{display:inline-block;border-radius:50px;padding:5px 9px;background:#eef3e8;font-size:11px;font-weight:800;letter-spacing:.04em;color:#55745e}.step{display:flex;gap:12px;align-items:start;margin-bottom:10px}.num{width:30px;height:30px;border-radius:50%;background:#e7efe1;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}.step h3{font-size:15px;margin:3px 0 9px;line-height:1.4}.row{display:flex;flex-wrap:wrap;gap:8px}.btn,.secondary{border:0;border-radius:11px;padding:10px 13px;font-weight:750;font-size:13px}.btn{background:#315f51;color:white}.secondary{background:#f5f7f1;color:#49685a;border:1px solid #e4ebe0}.linkbtn{background:none;border:0;padding:6px 0;color:#527463;font-weight:700;font-size:13px}.form label{display:block;font-size:13px;font-weight:750;margin:16px 0 6px}.form input,.form textarea,.form select{display:block;width:100%;border:1px solid #dce5d9;border-radius:11px;padding:12px;background:#fff;color:#253e35}.form textarea{min-height:85px;resize:vertical}.form .btn{margin-top:18px}.entry{margin-bottom:10px}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.breath{background:#e8efe2;border-radius:23px;padding:28px;text-align:center;margin:20px 0}.orb{height:120px;width:120px;margin:12px auto;border-radius:50%;background:#c7dfbd;display:grid;place-items:center;color:#315f51;font-family:Georgia,serif;font-size:18px}.hidden{display:none}.danger{color:#9a4c40}.footer{font-size:12px;color:#738779;line-height:1.55;margin-top:28px}a{color:#346b58}@media(min-width:650px){.cards.tracks{grid-template-columns:repeat(3,1fr)}.track{align-items:start;flex-direction:column;min-height:154px}.track .arrow{align-self:end}.shell{padding-top:35px}.hero{padding:38px}}

'use strict';const KEY='smallsteps-v1';const defaults=[{id:'talk',name:'Starting conversations',sub:'Open with something simple',icon:'✦',color:'sand',steps:['Say hello to someone you see regularly','Ask a simple question, like how someone’s day is going','Share a small observation and invite a response']},{id:'groups',name:'Being in groups',sub:'Find your place at your pace',icon:'◌',color:'mint',steps:['Spend a few minutes near a small group','Listen to a group conversation and stay as long as you choose','Add a short comment to a small group conversation']},{id:'voice',name:'Speaking up',sub:'Give your voice a little room',icon:'↗',color:'lavender',steps:['State a small preference to someone you trust','Ask a question when you want clarification','Share a brief opinion in a conversation']}];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{tracks:JSON.parse(JSON.stringify(defaults)),entries:[]};if(!Array.isArray(state.tracks)||!Array.isArray(state.entries))throw 0}catch(e){state={tracks:JSON.parse(JSON.stringify(defaults)),entries:[]}}const lessons=[{"title": "A small opening", "track": "Starting conversations", "audio": "lesson1.mp3", "duration": "5:16 min", "text": "Starting a conversation can feel like standing at the edge of a cold swimming pool. Your mind may tell you that you need the perfect opening, or that one awkward moment will ruin everything. But a conversation doesn't need a perfect beginning. It needs a small opening and room for another person to respond.\n\nLet's make the task smaller. Rather than trying to be interesting for ten minutes, consider saying hello to someone you already see. That's it. You might say, \"Good morning,\" to a neighbor or someone at a familiar place. You don't have to turn it into a conversation. If even that feels too big today, simply choose a person you might greet another time. Or rehearse the words quietly on your own. You choose the size of the step.\n\nBefore you try, notice any prediction. Maybe the thought is, \"They'll think I'm strange,\" or \"I won't know what to say.\" You don't need to argue with that thought. Just recognize that it is a prediction, not a report of what has happened. If you like, use the reflection in the app to write it down.\n\nAfterward, consider what actually happened. Perhaps the other person smiled. Perhaps they were distracted. Perhaps you felt nervous and still said hello. All of those are observations. A brief or neutral response isn't proof that you did something wrong; you usually can't know what else is on someone's mind.\n\nIf the greeting feels manageable another day, you can add one simple question: \"How's your day going?\" Listen to the answer, and let that be enough. You can leave the conversation naturally with \"Good seeing you.\" You do not owe anyone a long performance.\n\nThe goal is not to eliminate every uncomfortable feeling. The goal is to give yourself a choice and learn from a small experiment. If the step feels overwhelming, stop, pause, or make it smaller. There's no penalty for coming back to it later. Your effort deserves kindness, whether the interaction felt easy or awkward.\n\nLet's take a closer look at what that might be like. Imagine a person named Sam who often sees a neighbor at the same time in the morning. Sam wants to be friendly, but keeps thinking, \"What if I say something silly?\" One morning, Sam chooses a very small plan: make eye contact if it happens naturally and say, \"Morning.\" Nothing more is required.\n\nThe neighbor says, \"Morning,\" and keeps walking. Sam's first thought is, \"That was too short. They must not want to talk.\" But look at the actual evidence. Sam said hello. The neighbor returned the greeting. Both continued on their way. There are many possible reasons it was brief, including that the neighbor was on the way somewhere. Sam doesn't have to solve that mystery to count the exercise as done.\n\nAnother day, Sam decides to add a small question: \"How has your week been?\" The neighbor says, \"Busy, actually.\" Sam could say, \"I hope you get a chance to rest,\" and leave it there. Or Sam might ask, \"Anything good keeping you busy?\" Notice how neither response depends on a perfect line. Both grow out of what the other person actually said.\n\nOf course, not every attempt will feel smooth. Imagine the neighbor doesn't hear Sam the first time. Sam could repeat the greeting once, or simply keep walking. A missed greeting can be inconvenient or awkward without being a judgment of Sam's worth. If a person seems busy, uncomfortable, or uninterested, respecting that is part of a considerate interaction. You can choose someone else next time.\n\nBefore your own exercise, make a simple plan. Choose a familiar setting, a person who is generally safe and approachable, and one sentence. You might choose a cashier, a neighbor, or someone you already know. The sentence could be, \"Hi, how's your day going?\" If a question feels like too much, choose just \"Hello.\" If speaking to someone today feels overwhelming, rehearse the words privately or write the plan down. That is the easier version of the exercise.\n\nWhen the moment arrives, you don't need to check whether you feel completely confident. You can take a natural breath if it helps, but breathing is optional. Say the words when you're ready, and listen to the answer. If your attention gets caught on how your voice sounds, gently bring it back to the other person's words or the setting around you. There's no need to monitor every expression.\n\nAfterward, write what you did and what happened. You might write, \"I said hello. They smiled. I was nervous.\" Or, \"I rehearsed it privately and noticed I could make the sentence shorter.\" If you had a prediction beforehand, compare it with what you actually observed. Avoid filling gaps with guesses about the other person's thoughts. You can include one kind sentence about your effort.\n\nYour assignment today is to try the greeting, or its easier version, and write a few honest words about how it went. There's no right outcome and no pressure to repeat it until it feels perfect. Take your time. A small, chosen opening is enough for this session.\nOne last thought before you practice. A friendly opening is an invitation, not a performance you have to complete. If someone responds, you can listen. If they seem busy, you can leave space. If you choose the easier rehearsal today, that's a real way to prepare. In your reflection, include what you chose and one thing you noticed, even if it was simply that you tried."}, {"title": "Finding your place in a group", "track": "Being in groups", "audio": "lesson2.mp3", "duration": "5:08 min", "text": "Groups can be difficult because several conversations and reactions are happening at once. You may wonder when to speak, whether you belong, or whether everyone is judging you. Those worries can pull your attention inward, making it even harder to notice what's happening around you. You don't need to become the loudest person in the room to belong in a group.\n\nStart by choosing a situation that feels relatively manageable. That might be a small gathering with someone you know, rather than a crowded event. Decide how long you want to stay, with permission to leave earlier. The point isn't to endure as much discomfort as possible; it's to practice a step you have chosen.\n\nYour first exercise can be spending a few minutes near a small group. You could listen to the topic, notice who is speaking, and allow yourself to be present without preparing a perfect contribution. If that feels too much, an easier alternative is to imagine the setting, or stand nearby for a shorter time. You can stop or change the plan whenever you need to.\n\nWhen you're ready for a next step, try a short contribution connected to what's already being discussed. It might be, \"That sounds interesting,\" or \"How did that go?\" You can even ask someone to repeat a point you missed. A contribution doesn't need to be clever or long. Conversations are shared, and listening is part of participating too.\n\nBefore you practice, you might notice a prediction such as, \"Everyone will notice I'm nervous.\" Afterward, gently compare it with what you observed. Maybe one person answered your question. Maybe you didn't know what everyone was thinking. Maybe your voice felt shaky. Stick to what you actually know, rather than filling in every blank with the harshest explanation.\n\nIf the group is unkind or the situation feels unsafe, you don't have to stay. Choosing a different setting or a trusted person is a sensible adjustment. You can repeat the same manageable step as often as you want, and skip or edit the exercises in this app. Progress is not a straight line. What matters is that you are practicing in a way that respects your own limits.\n\nHere's an example. Imagine Leah arrives at a small gathering and sees three people talking. Leah's mind says, \"I have to join in immediately, and everyone will notice if I say the wrong thing.\" That sounds like a lot of work for one moment. Instead, Leah chooses a smaller task: spend a few minutes nearby, listen to the topic, and leave or take a break whenever needed.\n\nThe group is talking about a meal someone made. Leah hears one person say that the recipe took longer than expected. There is a natural pause, and Leah says, \"Was it worth the extra time?\" The person smiles and answers. Another person changes the subject. Leah notices a familiar thought: \"I should have said something more interesting.\" But the facts are simpler: Leah listened, asked a relevant question, and received an answer. That's a real contribution, even though the conversation moved on.\n\nNow imagine a different outcome. Leah stays nearby but doesn't find an opening to speak. That doesn't erase the practice. The chosen task was to spend a few minutes near a group and notice what was happening. Listening counts. If the group felt unwelcoming, leaving and choosing a different setting would be a reasonable decision, not a failure.\n\nGroups have a rhythm that can be hard to read. Sometimes people pause briefly between ideas; sometimes two people start speaking at once. If that happens to you, you might say, \"Go ahead,\" and let the other person finish. You don't have to fight for a perfect opening. You can also speak to one person at the edge of a group rather than addressing everyone. A short question about the current topic often works better than trying to invent a brilliant new subject.\n\nFor today's exercise, choose a group and setting that feel reasonably safe. It could be a small gathering where you know someone, a shared activity, or another ordinary setting. Decide on a short time that feels manageable. Your task is to be near the group and notice what is being discussed. Speaking is optional. If a real group feels too difficult today, picture the setting for a moment, or choose a shorter time near a group. Either easier option counts as your exercise.\n\nBefore you start, notice any prediction. Maybe it is, \"Everyone will judge me,\" or \"I won't know what to say.\" You can write that down, but you don't have to settle whether it is true before practicing. During the exercise, gently return your attention to a concrete detail outside yourself: the subject of the conversation, someone's words, or the room. The goal is not to force anxiety away. It's to make a little room for what is actually happening.\n\nAfterward, write a few sentences. What did you choose? What did you hear or notice? What did you actually observe, as distinct from what you guessed others were thinking? You might write, \"I stayed for two minutes, heard people talk about dinner, and felt nervous.\" If you imagined the setting, you might write what felt manageable about that. Acknowledge any small choice you made for yourself.\n\nYou can repeat this day or take more time before the next one. The aim is a manageable step, not enduring a situation that feels unsafe. Your pace belongs to you."}, {"title": "Giving your voice room", "track": "Speaking up", "audio": "lesson3.mp3", "duration": "5:07 min", "text": "Speaking up doesn't have to mean giving a speech. Often it starts with a small preference: \"I'd rather sit over there,\" or \"Could you explain that again?\" If you're shy, even a short sentence can feel important. That doesn't mean you're doing it wrong. It means you can start with a step small enough to be workable.\n\nFor this exercise, choose someone you generally feel comfortable with. Think of an ordinary, low-stakes preference that is true for you. Perhaps you prefer tea to coffee, or would like to choose a different time for a call. You might say, \"I'd prefer tea, thanks.\" You don't need to justify your preference or deliver the sentence perfectly.\n\nIf saying it to another person feels too hard right now, an easier version is to write the sentence down or practice saying it privately. Once that feels manageable, you might share it with the person you've chosen. You are free to wait, skip it, change it, or try another setting. Avoid situations where speaking up would put you at risk.\n\nNotice what your mind predicts. It might say, \"They'll be annoyed,\" or \"I'll sound foolish.\" These are understandable thoughts, but they are not evidence of the other person's reaction. If you want, write down the prediction before the exercise, then note what happened afterward. Did the person respond? What did they actually say? What remains unknown? Did you do anything you want to acknowledge, even if it felt awkward?\n\nPeople may not always agree with your preference. A different answer doesn't automatically mean speaking up was a mistake. The practice is expressing a reasonable preference, not controlling the response. You can be brief, respectful, and still leave space for the other person's needs.\n\nA next step might be asking a question when you want clarification. You can use a simple phrase like, \"Could you go over that once more?\" Or you may repeat the first exercise. There's no timetable and no streak to protect. You get to decide what feels manageable. And if anxiety is interfering with daily life, support from a healthcare professional is another option alongside self-guided practice.\n\nLet's look at a small example. Imagine Daniel and a friend are choosing where to sit. Daniel would prefer a quieter table, but the thought appears, \"If I say anything, I'll be difficult.\" Daniel decides to try one short sentence: \"Would you mind sitting over there? It's a little quieter.\" The friend says, \"Sure,\" and they move. Daniel is surprised that expressing a preference didn't require a long explanation.\n\nBut let's imagine a second version. The friend says, \"I'd rather stay here; I'm waiting for someone.\" Daniel can say, \"Okay, I understand,\" and consider another option. A different answer doesn't make the request wrong. Speaking up is an opportunity to express a need or preference; it isn't a guarantee that the other person will agree. Both people can have preferences, and a respectful conversation can make space for both.\n\nNow imagine Daniel starts a sentence and feels a little shaky. Daniel pauses and says, \"I'd prefer the quieter table, if that works.\" The words don't have to come out smoothly to be understandable. A pause, a nervous feeling, or a brief stumble doesn't cancel the message. If the other person asks a question, Daniel can take a moment before answering.\n\nFor your exercise, first pick someone you generally trust and an ordinary, low-stakes choice. Think about what you genuinely prefer. It could be where to sit, a drink, or the time for a casual conversation. Put it into one simple sentence. For instance, \"I'd prefer tea, please,\" or \"Could we talk a little later?\" You can be kind and direct at the same time. You don't need a complicated speech or an apology for having a preference.\n\nIf sharing the sentence today feels too difficult, make the exercise smaller: write it down or say it privately. Either option counts. You can try the spoken version with a trusted person another time. Avoid situations where speaking up could put you at risk, or where the person is likely to be unkind. You are free to pause, change the exercise, or select the easier version.\n\nBefore practicing, notice your prediction. You might think, \"They'll be annoyed,\" or \"I'll sound foolish.\" Write it if that helps, without treating it as a fact. Then do the version you chose. If you share your preference with someone, listen to the actual response. If you rehearse privately, notice what it was like to form the sentence. Was it clear? Did you want to make it shorter? There is no test of how confident you look.\n\nAfterward, record what you tried and what happened. You might write, \"I told my friend I preferred tea; they said okay, and my voice felt quiet.\" Or, \"I wrote my preference and practiced it once.\" If the answer was different from what you wanted, you can describe that without concluding that you should never speak up. Give yourself credit for choosing a manageable step.\n\nA useful next sentence to keep nearby is, \"Could you explain that again?\" Asking for clarification is another form of speaking up. You don't need to try it today unless you want to. For now, complete your chosen preference exercise, write how it went, and take a break. One honest sentence can be enough."}, {"title": "When you fear judgment", "track": "Fear of judgment", "audio": "lesson4.mp3", "duration": "5:09 min", "text": "When you worry about being judged, your mind may try to read another person's thoughts. A glance or a quiet response can quickly become, \"They think I'm foolish.\" But a thought is not the same as evidence. People can be distracted, tired, or thinking about something entirely unrelated. We usually cannot know exactly what another person thinks.\n\nToday's exercise is a small experiment in noticing the difference between a prediction and what you actually observe. Pick an ordinary, safe interaction that feels manageable. It could be saying hello to someone familiar, or asking a simple question. Beforehand, write one sentence about what you think might happen. You might predict, \"They will think my question is silly.\" Then, if you choose, try the interaction. There is no need to prove your fear wrong or make the other person respond in a particular way.\n\nAfterward, write down what you saw or heard, using the most concrete words you can. For example, \"They answered the question and looked away.\" Then notice what you cannot know. You may not know why they looked away, or what they were thinking. That uncertainty is allowed. A balanced observation might be, \"I felt nervous, and they answered. I don't know what they thought.\"\n\nIf an interaction feels too difficult today, make the exercise smaller. Write down a prediction about a past, low-stakes moment, and separate what you observed from what you assumed. You can also rehearse with someone you trust. Avoid situations that feel unsafe or involve someone unkind. You can pause, and you do not need to push through distress.\n\nWhen you reflect, be as fair to yourself as you would be to a friend. The aim isn't to convince yourself that everybody approves of you. It's to notice the limits of mind reading, and to give yourself room to act without needing certainty. A small, chosen step is enough.\n\nConsider an imaginary example. Alex wants to ask a colleague a simple question about a shared task. Before asking, Alex predicts, \"They'll think I should already know the answer.\" Alex notices a flutter of anxiety and considers saying nothing. Instead, Alex chooses a short, respectful question: \"Could you show me where to find that information?\" The colleague answers, \"It's in the folder,\" and returns to work.\n\nLater, Alex notices the thought, \"They sounded annoyed.\" That may be one possible interpretation, but it isn't the same as knowing what the colleague thought. What Alex actually observed was a short answer and the colleague returning to work. Perhaps the colleague was busy. Perhaps the answer was straightforward. Perhaps the tone did carry irritation. Without more information, Alex doesn't need to pretend to know. A balanced note might read, \"I asked, and I got the information. Their answer was brief. I don't know what they thought.\"\n\nThe point of this exercise is not to argue yourself into believing a rosy story. Some people can be impatient or critical. If someone says something unkind, you can acknowledge what was said and decide what boundary or support you need. Fair thinking includes real evidence, not just comforting evidence. It also leaves room for what you don't know, instead of treating the worst guess as a verdict.\n\nLet's try another example. Imagine someone says hello to a neighbor, who gives a small nod but doesn't stop. The immediate prediction might be, \"They don't like me.\" A more concrete account is, \"I said hello, and they nodded while walking.\" Many explanations fit that observation. The neighbor could be late, distracted, reserved, or simply continuing to walk. You don't have to choose the most positive explanation. It is enough to notice that the judgment is not established.\n\nFor your own practice, choose a situation with low stakes and an approachable person. You might ask a familiar person a straightforward question, or offer a simple greeting. Beforehand, write down one prediction in ordinary language. Keep it specific: \"I think they will roll their eyes,\" is easier to compare with observation than, \"Everything will be terrible.\" Then try the interaction if it feels manageable. Do not choose a person or setting that feels unsafe.\n\nIf interacting is too much today, use a mild past situation. Write the prediction or worry you remember having, then describe only what you saw or heard. You may also use an imaginary example. This is not a lesser result; it's a way to practice the same distinction at a size you choose.\n\nAfter your chosen exercise, use three short lines. First: \"My prediction was...\" Second: \"What I observed was...\" Third: \"What I can't know is...\" You might also add, \"One thing I did for myself was...\" A few words on each line are enough. If the interaction didn't happen as planned, you can describe that honestly. You can return to it another day.\n\nSometimes the mind wants complete reassurance that no one is judging us. That's a very difficult promise for anyone to provide. Instead, this practice offers a different skill: allowing uncertainty while staying connected to observable details and your own choices. You can take your time with that. A fair description, even of an imperfect interaction, is a meaningful way to finish today."}, {"title": "After an awkward moment", "track": "Recovering from awkward moments", "audio": "lesson5.mp3", "duration": "5:13 min", "text": "An awkward moment can stick in your mind long after the conversation is over. Perhaps you lost your words, interrupted someone, or didn't get the response you expected. Your mind may replay it and turn a brief moment into a verdict about who you are. But a moment is just a moment, not your whole story.\n\nToday, choose a small, past awkward moment that feels safe enough to remember. There is no need to pick a painful or overwhelming experience. Write a short, factual description of what happened. Then add what you cannot know. For instance, \"I paused before answering. I don't know whether the other person noticed, or what they thought.\" Try not to fill in the missing pieces with the harshest possible explanation.\n\nNext, write one sentence you might say to a friend who had the same experience. It might be, \"It was an uncomfortable pause, and people sometimes pause.\" This is not about pretending the moment felt good. It's about responding to yourself fairly, without turning one experience into a permanent label.\n\nIf you want a practical response for another time, keep it simple. You could say, \"Let me think for a moment,\" or \"Sorry, go ahead,\" if you interrupted. Then return your attention to the conversation. You don't have to apologize repeatedly or replay every detail to earn the right to move on. If the other person was unkind, you can choose distance or seek support; you do not have to put yourself in an unsafe situation.\n\nFor an easier version, imagine a mild fictional awkward moment and write the kind sentence about that instead. For any version, you can stop or take a break. When you're done, reflect on how it went. Did your description change when you separated facts from guesses? What would you like to remember next time?\n\nBeing socially confident doesn't mean never feeling awkward. It can mean allowing an imperfect moment to pass, treating yourself with respect, and choosing your next small step when you're ready.\n\nHere's an imaginary example. Mira is talking with a friend and accidentally speaks at the same time. Mira quickly says, \"Sorry, go ahead.\" The friend continues, and the conversation moves on. Later that evening, Mira remembers the interruption and thinks, \"I was so rude. They must be upset with me.\" The memory feels convincing, but feelings alone don't tell Mira what the friend thought.\n\nMira tries a more factual account: \"We started speaking at the same time. I apologized once, and my friend continued talking.\" Mira also notes, \"I don't know whether my friend was bothered.\" This doesn't prove the friend felt any particular way. It simply separates a description from a guess. Then Mira writes a kind sentence: \"People sometimes overlap in conversation, and I gave my friend room to finish.\"\n\nImagine a different awkward moment: someone asks you a question and your mind goes blank. You might say, \"Give me a second to think,\" or \"I'm not sure yet.\" Those are ordinary responses. You don't need to fill every silence immediately. If you remember something you wanted to add later, you can decide whether to bring it up. You are allowed to move on even if the moment didn't feel polished.\n\nSometimes there really is something to repair. Perhaps you interrupted repeatedly, or said something that hurt someone. A brief, sincere apology or clarification can be appropriate. You might say, \"I'm sorry I interrupted; I'd like to hear the rest.\" Then allow the other person room to respond. Repair is different from endlessly punishing yourself or demanding reassurance. If a situation involves harm or unsafe behavior, seek appropriate support rather than trying to handle everything alone.\n\nFor today's exercise, pick a mild past moment, not the most painful one you can remember. It could be a brief pause or an ordinary conversational mix-up. Write one or two sentences about what happened, sticking to what you observed. Next, write what remains uncertain. Finally, write one sentence of fair kindness, as though you were speaking to a friend in the same situation.\n\nFor example: \"I lost my place for a moment. The other person waited. I don't know what they thought. It's okay to pause while I find my words.\" You don't have to force yourself to believe every word immediately. You are simply trying out a less punishing way of describing the moment.\n\nIf remembering a real moment feels too intense, use a fictional example instead. Imagine a person drops a pen while talking, pauses to pick it up, and resumes. What happened? What is unknown? What kind sentence would you offer that person? That easier version counts for today's exercise. Stop or take a break if you need to, and choose a safer or smaller example.\n\nOnce you've tried your version, write how it went. You might note whether separating facts from guesses changed anything, or whether the kind sentence felt difficult to write. There is no need to turn the experience into a lesson immediately. A few honest words are enough to finish the day.\n\nWhen another awkward moment arrives, remember that you have choices. You can pause, respond simply, repair if appropriate, or let the moment pass. Confidence is not a spotless record. It is making room for ordinary human moments while treating yourself with the same fairness you would offer someone else."}];let page='home',current='',stepIndex=0,timer=null,sessionIndex=0;state.program=state.program||[];const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Could not save in this browser. Your latest change may not persist.');return false}}function show(p){if(timer){clearInterval(timer);timer=null}page=p;render();app.scrollTo(0,0)}function track(){return state.tracks.find(t=>t.id===current)}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));let h='<div class="top"><div class="brand"><div class="logo">↗</div>small steps</div><span class="tag">at your pace</span></div>';if(page==='home'){let next=lessons.findIndex((_,i)=>!prog(i).completed);let finished=next<0;let i=finished?lessons.length-1:next,d=prog(i),seconds=[316.44,307.68,307.44,309.288,313.056][i];let heard=!!d.completed||listened(d,seconds);h+=`<section class="hero"><div class="tag">YOUR GUIDED PROGRAM</div><h1>Small steps, at your pace.</h1><p>Listen, try a manageable exercise, and reflect. Your progress stays here when you return.</p></section><div class="card"><span class="pill">${finished?'FIVE DAYS COMPLETE':`${DAYS[i].toUpperCase()} · SESSION ${i+1} OF 5`}</span><h3>${finished?'You completed this course':esc(lessons[i].track)}</h3><p class="muted">${finished?'Your lessons are available to review. More sessions are being prepared.':esc(lessons[i].title)+' · '+esc(lessons[i].duration)}</p>${finished?'':`<p c icture the setting or stay nearby for a shorter time.",voice:"Write your preference down or say it privately."}[t.id]||"Make this step smaller."):"Try a smaller part of this step, or return to an earlier one.")}</p><div class="row"><button class="btn" data-practice="${i}">Try this</button><button class="secondary" data-edit="${i}">Edit</button><button class="secondary" data-delete="${i}" aria-label="Delete step ${i+1}">Remove</button></div></div></div>`).join('')}<button class="secondary" data-add>Add a step ＋</button><div class="note">You can stop or change course at any time. There’s no need to push through distress.</div>`}else if(page==='practice'){let t=track(),s=t?.steps[stepIndex];if(!s){show('home');return}h+=`<button class="back" data-go="track">← Back to path</button><div class="tag">A step you chose</div><h2>${esc(s)}</h2><p class="intro">Try it when you feel ready. You can save a note now, later, or not at all.</p><form class="card form" id="reflection"><label for="prediction">What do you predict might happen? <span class="muted">Optional</span></label><textarea id="prediction" placeholder="A thought, not a fact…"></textarea><label for="before">How difficult does it feel? <span class="muted">Optional</span></label><select id="before"><option value="">Prefer not to rate</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><div class="muted">1 = easier · 5 = harder</div><label for="outcome">What actually happened? <span class="muted">Optional</span></label><textarea id="outcome" placeholder="Notice what happened, without judging yourself"></textarea><label for="after">How difficult did it feel afterward? <span class="muted">Optional</span></label><select id="after"><option value="">Prefer not to rate</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label for="kind">What would you like to remember? <span class="muted">Optional</span></label><textarea id="kind" placeholder="Even a small effort is worth noticing"></textarea><button class="btn" type="submit">Save this reflection</button></form><p class="muted">Not ready? Go back, make the step smaller, or skip it. Nothing is lost.</p>`}else if(page==='lessons'){h+=programList()}else if(page==='session'){h+=programSession(sessionIndex)}else if(page==='progress'){h+=`<div class="tag">Your space</div><h2>Notes on your journey</h2><p class="intro">A place to notice effort and what you learned—not a scorecard.</p>${state.entries.length?state.entries.slice().reverse().map(e=>`<article class="card entry"><span class="pill">${esc(e.track)}</span> <span class="muted">${esc(e.date)}</span><h3>${esc(e.step)}</h3>${e.prediction?`<p><b>Predicted:</b> ${esc(e.prediction)}</p>`:''}${e.outcome?`<p><b>What happened:</b> ${esc(e.outcome)}</p>`:''}${e.kind?`<p><b>Remember:</b> ${esc(e.kind)}</p>`:''}${e.before||e.after?`<p class="muted">Difficulty: ${esc(e.before||'—')} before · ${esc(e.after||'—')} after (out of 5)</p>`:''}<button class="linkbtn danger" data-remove-entry="${esc(e.id)}">Delete note</button></article>`).join(''):'<div class="card"><p>No notes yet. When you choose to save a reflection, it will appear here.</p></div>'}`}else if(page==='calm'){h+=`<div class="tag">A moment for you</div><h2>Take a gentle pause.</h2><p class="intro">If it feels comfortable, try a few easy breaths. No need to change or control anything. You can stop whenever you like.</p><div class="breath"><div class="orb" id="breath-text">Just breathe</div><p class="muted">Breathe in gently, then let the breath go naturally.</p><button class="btn" id="breath">Start gentle guide</button></div><div class="note">Or simply look around and notice a few things you can see. This is optional, never a requirement before a step.</div>`}else if(page==='settings'){h+=`<div class="tag">Your data, your choice</div><h2>Settings & privacy</h2><p class="intro">Your notes and edited steps are stored in this browser on this device. They are not encrypted or synced. Anyone with access to function addRange(d,a,b){if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)return;let list=[...(d.ranges||[]),[a,b]].sort((x,y)=>x[0]-y[0]),out=[];for(let r of list){let last=out[out.length-1];if(last&&r[0]<=last[1]+.4)last[1]=Math.max(last[1],r[1]);else out.push([...r])}d.ranges=out}

function programList(){return `<div class="tag">Your guided program</div><h2>Five days, five small steps.</h2><p class="intro">Begin whenever you like. These are five sessions labeled Sunday through Thursday—not a date lock. If a day takes longer, pick up where you left off. No weekly reset.</p>${lessons.map((l,i)=>{let d=prog(i),ok=allowed(i);return `<article class="card entry"><span class="pill">${DAYS[i]} · Day ${i+1}</span> <span class="muted">${esc(l.duration)}</span><h3>${esc(l.track)}</h3><p class="muted">${d.completed?'Completed · available to review':ok?'Ready when you are':'Locked until the previous day is complete'}</p><button class="${ok?'btn':'secondary'}" data-session="${i}" ${ok?'':'disabled'}>${d.completed?'Review':ok?'Open lesson':'Locked'}</button></article>`}).join('')}<div class="note">To open the next day, listen to the whole lesson, mark your chosen exercise done, and write how it went. You can pause, change to the easier option, and return later.</div>`}
function programSession(i){if(!allowed(i))return '<p>This day opens after the previous session is complete.</p><button class="back" data-go="lessons">← Back to program</button>';let l=lessons[i],d=prog(i),ex=exercises[i];return `<button class="back" data-go="lessons">← All five days</button><div class="tag">${DAYS[i]} · Day ${i+1}</div><h2>${esc(l.title)}</h2><p class="intro">${esc(l.track)} · ${esc(l.duration)} · Original AI narration</p><div class="card entry"><h3>1. Listen to the whole lesson</h3><audio id="program-audio" controls preload="metadata" style="width:100%" src="${esc(l.audio)}"></audio><p id="listen-status" class="muted">Listening progress: ${Math.round(coverage(d))} seconds. Play each part; seeking ahead won’t count as listening.</p><details><summary class="linkbtn">Read transcript</summary><p>${esc(l.text)}</p></details></div><form id="session-form" class="card form"><h3>2. Try your exercise</h3><p>${esc(ex.task)}</p><label><input type="checkbox" id="exercise-done" ${d.exercise?'checked':''} style="display:inline;width:auto"> I did the exercise or its easier version</label><h3>3. Reflect</h3><label for="session-reflection">${esc(ex.prompt)}</label><textarea id="session-reflection" required placeholder="A few honest words are enough">${esc(d.reflection)}</textarea><p class="muted">Your exercise is self-confirmed. Your listening progress and reflection stay in this browser, unencrypted and not synced.</p><button class="btn" type="submit">${d.completed?'Save reflection':'Complete this day'}</button><p id="gate-status" class="muted" role="status"></p></form><div class="note">Need a break? You can pause and come back. Choose an easier version if that fits better; there is no need to push through distress.</div>`}
function bindProgram(){app.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{let i=+b.dataset.session;if(allowed(i)){sessionIndex=i;show('session')}});if(page!=='session'||!allowed(sessionIndex))return;let i=sessionIndex,d=prog(i),audio=document.getElementById('program-audio'),form=document.getElementById('session-form'),check=document.getElementById('exercise-done'),ref=document.getElementById('session-reflection'),status=document.getElementById('listen-status'),gate=document.getElementById('gate-status');let lastTime=null,lastWall=null;function statusUpdate(){status.textContent=listened(d,audio.duration)?'Whole lesson listened ✓':`Listening progress: ${Math.round(coverage(d))} of ${Number.isFinite(audio.duration)?Math.ceil(audio.duration):'…'} seconds. Play each part; seeking ahead won’t count.`}function resetPoint(){lastTime=null;lastWall=null}audio.addEventListener('loadedmetadata',statusUpdate);audio.addEventListener('play',()=>{lastTime=audio.currentTime;lastWall=performance.now()});audio.addEventListener('seeking',resetPoint);audio.addEventListener('seeked',resetPoint);audio.addEventListener('pause',()=>{sample();resetPoint()});audio.addEventListener('ratechange',resetPoint);function sample(){let now=performance.now(),t=audio.currentTime;if(!audio.seeking&&lastTime!==null&&lastWall!==null){let dt=t-lastTime,wall=(now-lastWall)/1000;if(dt>0&&wall>0&&dt<=wall*1.35+.12&&dt<2&&audio.playbackRate<=1.25){addRange(d,lastTime,t);save()}}lastTime=t;lastWall=now;statusUpdate()}audio.addEventListener('timeupdate',sample);check.onchange=()=>{d.exercise=check.checked;save()};ref.oninput=()=>{d.reflection=ref.value;save()};form.onsubmit=e=>{e.preventDefault();d.exercise=check.checked;d.reflection=ref.value;if(!listened(d,audio.duration)){gate.textContent='Please listen to every part of the lesson first. Skipped sections do not count.';return}if(!d.exercise||!d.reflection.trim()){gate.textContent='Please mark the exercise done and write how it went.';return}d.completed=true;save();show('lessons')}}
